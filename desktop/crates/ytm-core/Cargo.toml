[package]
name = "ytm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
