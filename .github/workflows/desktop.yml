name: Desktop

on:
  push:
    branches: [main, cross-platform]
    paths:
      - "desktop/**"
      - "YTMusicfastTests/Fixtures/**"
      - "clients.json"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "YTMusicfastTests/Fixtures/**"
      - "clients.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

# Linux and Windows runner minutes are free for public repositories but billed (Windows at 2×) for
# private ones, so while the repository is private only manual runs happen ("Run workflow" in the
# Actions tab), as in ci.yml.

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            binary: ytmusicfast
          - os: windows-latest
            name: windows-x86_64
            binary: ytmusicfast.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # libmpv for playback; the rest is what Slint's winit backend and femtovg (OpenGL) renderer
        # need to build (Slint's docs/building.md). Wayland, EGL and GL are loaded at run time.
        run: |
          sudo timeout 600 apt-get update
          sudo timeout 600 apt-get install -y --no-install-recommends \
            pkg-config libmpv-dev libfontconfig-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/libmpv-windows

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # The cache key already hashes desktop/Cargo.lock and the toolchain version.
          workspaces: desktop

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        # The live network test is opt-in (YTF_LIVE=1); CI runs the offline suite.
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --locked -p ytmusicfast

      - name: Collect the build
        shell: pwsh
        run: |
          $dist = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'dist')
          Copy-Item (Join-Path 'target' 'release' '${{ matrix.binary }}') $dist
          if ($IsWindows) { Copy-Item (Join-Path $env:MPV_DIR 'libmpv-2.dll') $dist }

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ytmusicfast-${{ matrix.name }}
          path: ${{ runner.temp }}/dist/
          retention-days: 7
          if-no-files-found: error
